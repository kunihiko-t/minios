[package]
name = "minios-kernel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[features]
qemu-test-boot = []
qemu-test-timer = []
qemu-test-trap = []
qemu-test-memory = []
qemu-test-vm = []
qemu-test-elf = []
qemu-test-user-entry = []
qemu-test-user-trap = []
qemu-test-user-syscall = []
qemu-test-user-exit = []
# user-exitの実行窓を使い、syscall中のtrap stack溢れがguard pageで止まることを確かめる。
qemu-test-kernel-stack = ["qemu-test-user-exit"]
qemu-test-irq-uart = []
qemu-test-irq-blk = []
qemu-test-net-arp = []
qemu-test-net-ping = []
# `-smp 2`環境でsecondary hartをSBI HSM経由で起動できることを確かめる。
qemu-test-smp-boot = []
# `-smp 2`環境でsecondary hartがper-hartのtrap handlerでtimer割り込みを
# 受けられることを確かめる。
qemu-test-smp-timer = []
# `-smp 2`環境でboot hartがSBI IPI経由のsoftware割り込みをsecondary
# hartへ届けられることを確かめる。
qemu-test-smp-ipi = []
qemu-test-fdt = []
qemu-test-heap = []
qemu-test-virtio = []

[dependencies]
minios-abi = { path = "../abi" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "minios-kernel"
path = "src/main.rs"
test = false
bench = false
