<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sv39と実行前ELFロードの構成</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45, 49, 66, 0.12);
      --rule-solid: #bfc0c0;
      --accent: #eb6c36;
      --accent-tint: rgba(235, 108, 54, 0.08);
      --link: #2e5aa8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Geist", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    }

    main {
      width: min(100%, 1360px);
      margin: 0 auto;
      padding: 40px;
    }

    header {
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--soft);
      font-family: "Geist Mono", "Noto Sans Mono CJK JP", monospace;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Instrument Serif", "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-size: 28px;
      font-weight: 400;
      line-height: 1.2;
    }

    .lede {
      max-width: 880px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    figure {
      margin: 0;
      overflow-x: auto;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 960px;
      height: auto;
    }

    footer {
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid var(--rule);
      color: var(--soft);
      font-family: "Geist Mono", "Noto Sans Mono CJK JP", monospace;
      font-size: 8px;
      letter-spacing: 0.12em;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Architecture / Sv39 / ELF64</p>
      <h1>Sv39と実行前ELFロードの構成</h1>
      <p class="lede">カーネルのAddressSpaceはsatpでactiveになり、LoadedImageは所有権を保ったinactiveな空間として残ります。
        U-mode遷移、user trap context、write、exitは未実装です。</p>
    </header>

    <figure>
      <svg viewBox="0 0 1280 720" role="img" aria-labelledby="sv39-loaded-image-architecture-title sv39-loaded-image-architecture-desc" xmlns="http://www.w3.org/2000/svg">

        <desc id="sv39-loaded-image-architecture-desc">QEMUとOpenSBIからkernel_mainを経てactiveなSv39カーネル空間を作る起動経路と、ELF64 byteを検証してinactiveなLoadedImageを作るロード経路が、同じFrameAllocatorからframeを確保しつつ、active側のKERNEL_ADDRESS_SPACE_STORAGEとinactive側のELF_ADDRESS_SPACE_STORAGEに別々のownership ledgerを保持し、vmとelfのQEMU harnessが両方をS-modeから観測する一方、U-modeはまだ実行しない構成です。</desc>

        <rect x="40" y="352" width="920" height="192" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
