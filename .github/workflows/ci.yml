name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.98.0
          targets: riscv64gc-unknown-none-elf, riscv32im-unknown-none-elf
          components: rustfmt, clippy
      - name: Cache Cargo data and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
      - name: Diagnose the environment
        run: cargo xtask setup
      - name: Run unified checks
        run: cargo xtask check
